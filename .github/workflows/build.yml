name: build

# A real monkeyc build against a real device definition.
#
# DORMANT BY DECISION -- see issue #1. The Connect IQ SDK ships NO device
# definitions; they are a separate, authenticated download, so this job needs
# Garmin credentials. Those are full-privilege personal account credentials,
# not scoped tokens, and the decision was not to put them in a public
# repository's secrets.
#
# This file is kept because it documents precisely what a credentialed build
# requires, and activates by adding two secrets if that is ever revisited.
#
# It is manual-dispatch only on purpose. Running on push would post a green
# "monkeyc (enduro3): pass" against every commit while building nothing --
# a check that cannot fail is worse than no check, because it reads as
# coverage that does not exist.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CIQ_SDK_VERSION: "9.2.0"

jobs:
  build:
    name: monkeyc (enduro3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Determine whether this run can build
        id: gate
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
        run: |
          set -euo pipefail
          # Manual dispatch only, so there is no fork-PR case to handle.
          if [ -z "${GARMIN_USERNAME:-}" ]; then
            echo "::error::GARMIN_USERNAME is not set - this workflow cannot build." \
                 "It is dormant by decision (issue #1). Set GARMIN_USERNAME," \
                 "GARMIN_PASSWORD and the CIQ_AGREEMENT_HASH variable to enable it."
            exit 1
          fi
          echo "can_build=true" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: Install connect-iq-sdk-manager
        run: go install github.com/lindell/connect-iq-sdk-manager-cli@latest

      - name: Cache SDK and device definitions
        uses: actions/cache@v6
        with:
          path: ~/.config/connect-iq-sdk-manager
          key: ciq-${{ env.CIQ_SDK_VERSION }}-${{ hashFiles('manifest.xml') }}

      - name: Fetch SDK and devices
        env:
          GARMIN_USERNAME: ${{ secrets.GARMIN_USERNAME }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          AGREEMENT_HASH: ${{ vars.CIQ_AGREEMENT_HASH }}
        run: |
          set -euo pipefail
          connect-iq-sdk-manager login --agreement-hash "$AGREEMENT_HASH"
          connect-iq-sdk-manager sdk set --version "$CIQ_SDK_VERSION"
          connect-iq-sdk-manager device download --manifest manifest.xml
          echo "$(connect-iq-sdk-manager sdk current-path)/bin" >> "$GITHUB_PATH"

      - name: Generate a throwaway signing key
        run: |
          set -euo pipefail
          # Side-loaded builds do not need a stable signing identity; only a
          # store submission does. The real developer key never reaches CI.
          openssl genrsa -out ci_key.pem 4096 2>/dev/null
          openssl pkcs8 -topk8 -inform PEM -outform DER \
            -in ci_key.pem -out ci_key.der -nocrypt

      - name: Build for enduro3
        run: |
          set -euo pipefail
          mkdir -p build
          monkeyc -d enduro3 -f monkey.jungle \
            -o build/Ridgeline.prg -y ci_key.der

      - name: Type check (report only)
        continue-on-error: true
        run: |
          # ~78 errors today, nearly all missing type annotations. Reported so
          # the count is visible and can be driven down, not enforced -- see
          # the strict type checking section of the README.
          monkeyc -d enduro3 -f monkey.jungle \
            -o /tmp/strict.prg -y ci_key.der -l 3 2>&1 | tee strict.log || true
          echo "strict-mode findings: $(grep -c '^ERROR' strict.log || echo 0)"

      - name: Remove the signing key before archiving
        if: always()
        run: rm -f ci_key.pem ci_key.der

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          name: Ridgeline-enduro3
          path: build/Ridgeline.prg
          if-no-files-found: error
